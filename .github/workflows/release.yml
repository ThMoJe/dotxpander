name: Build and Release

on:
  push:
    # Trigger on Major and Minor version tags (e.g., v0.1.0, v0.2.0, v1.0.0, v2.3.0)
    # Patch releases (e.g., v0.1.1, v1.0.4) will NOT trigger a release build
    tags:
      - 'v*.*.0'
  workflow_dispatch:
    inputs:
      tag:
        # ⚠ SYNC: Keep this default in step with `version` in Cargo.toml.
        # GitHub Actions does not support dynamic defaults, so bump this
        # manually every time you bump the version in Cargo.toml.
        description: 'Tag to publish release for (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-pc-windows-msvc
            arch_name: arm64
            exe_name: dotXPANDER-ARM64.exe
          - target: x86_64-pc-windows-msvc
            arch_name: x64
            exe_name: dotXPANDER-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Build release binary (build-std)
        run: cargo +nightly build -Z build-std=std,panic_abort --release --target ${{ matrix.target }}

      - name: Compress binary with UPX (x64 only)
        if: matrix.arch_name == 'x64'
        shell: pwsh
        run: |
          choco install upx --no-progress
          upx --best --lzma "target/${{ matrix.target }}/release/dotxpander.exe"

      - name: Package zip archive
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_name }}" -match '^v') { "${{ github.ref_name }}" } else { "latest" }
          $zipName = "dotxpander-${version}-${{ matrix.arch_name }}.zip"
          
          # Create staging folder
          $stageDir = "dist_${{ matrix.arch_name }}"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          
          # Copy binary, README, and LICENSE
          Copy-Item "target/${{ matrix.target }}/release/dotxpander.exe" -Destination "$stageDir\${{ matrix.exe_name }}"
          Copy-Item "README.md" -Destination "$stageDir\README.md"
          Copy-Item "LICENSE" -Destination "$stageDir\LICENSE"
          
          # Also copy standalone exe for direct download
          Copy-Item "target/${{ matrix.target }}/release/dotxpander.exe" -Destination "${{ matrix.exe_name }}"
          
          # Compress to zip
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipName -Force
          Write-Host "Created $zipName and ${{ matrix.exe_name }}"

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppArchitecture="${{ matrix.arch_name }}" /DMyAppExePath="..\target\${{ matrix.target }}\release\dotxpander.exe" installer\setup.iss
          Copy-Item "dist_installers\dotXPANDER-Setup-${{ matrix.arch_name }}.exe" -Destination .

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4.6.2
        with:
          name: package-${{ matrix.arch_name }}
          path: |
            *.zip
            *.exe
            dotXPANDER-Setup-*.exe

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release_assets
          sha256sum *.zip *.exe > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: |
            release_assets/*.zip
            release_assets/*.exe
            release_assets/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
